#exps button{margin-left:6px}

input[type=text],input:not([type]){padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;min-width:0}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 14px;background:var(--red);color:#fff;font-weight:700}
button.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}

#menu{left:10px;top:calc(env(safe-area-inset-top,0px) + 58px)}

#sq{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:7px 4px;outline:0}

#sr small{color:var(--mut)}

#zc{position:fixed;z-index:5;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#zc button{width:48px;height:48px;font-size:26px;padding:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px #0004}
#panel{position:fixed;z-index:20;left:0;right:0;top:0;max-height:84vh;overflow:auto;background:var(--bg);border-bottom:3px solid var(--line);box-shadow:0 8px 24px #0006;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px;transform:translateY(-105%);visibility:hidden}

@media (prefers-reduced-motion:no-preference){#panel{transition:transform .25s,visibility .25s}}
.inner{max-width:640px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-family:Almendra,Georgia,serif;font-size:28px;line-height:1.05;margin:0 0 6px}
h2{font-family:Almendra,Georgia,serif;font-size:21px;margin:22px 0 8px}
.sub{margin:0 0 12px;color:var(--mut)}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.head small{color:var(--mut)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 10px;color:var(--mut)}.stats b{color:var(--ink)}

.chip.on{outline:2px solid var(--gold)}

.vs{display:flex;align-items:center;justify-content:space-around;gap:8px}
#elog{padding-left:18px;margin:8px 0}
#mus{left:10px;top:calc(env(safe-area-inset-top,0px) + 104px)}

<body>
<div id="scene" class="m"></div>
<div id="fac"></div>
<div id="sb" class="hud"><input id="sq" type="search" placeholder="Cerca provincia o comune" autocomplete="off" aria-label="Cerca provincia o comune"><div id="sr"></div></div>
<button id="menu" class="hud" aria-label="Apri il pannello">☰ Pannello</button>
<button id="mus" class="hud"></button>
<button id="rst" class="hud">↺ Ricomincia</button>
<div id="chip" class="hud" aria-live="polite"></div>

<aside id="opp" class="sheet" aria-label="Stato selezionato"></aside>
<aside id="bpan" class="sheet" style="z-index:25" aria-label="Caserma"></aside>
<div id="enc"><div id="encc"></div></div>

<aside id="panel" class="open" aria-label="Pannello dati"><div class="inner">
<div class="ph"><h1>L’Italia dei comuni</h1><button id="pclose" class="alt">Chiudi</button></div>
<p class="sub" id="intro"></p>
<div id="found"><h2>Fonda il tuo stato</h2>
<form id="f">
<input id="com" placeholder="Comune (es. Rivalta)" maxlength="30" required aria-label="Comune">
<input id="ig" placeholder="Il tuo nome Instagram (es. @alloski)" maxlength="30" aria-label="Nome Instagram">
<input id="prov" list="capl" placeholder="Provincia (es. Cuneo)" maxlength="30" aria-label="Provincia"><datalist id="capl"></datalist>
<input id="reg" placeholder="Regione (se non sai la provincia)" maxlength="30" aria-label="Regione">
<div id="fd"></div>
<button type="submit">Fonda lo stato</button>
</form></div>
<div id="game">
<h2>Il tuo stato</h2><div id="sel"></div>
<div id="barr"></div>
<h2>Spedizioni</h2><ul id="exps"></ul>
<h2>Alleanze</h2><ul id="allies"></ul>
<h2>Classifica</h2>
<div class="row"><button class="alt chip on" data-tab="w">Più vittorie</button><button class="alt chip" data-tab="p">Più abitanti</button></div>
<ol id="rank"></ol>
<h2>Eventi</h2><ul id="log"></ul>
<div class="row"><button class="alt" id="reset">Ricomincia da zero</button></div>
</div>
</div></aside>

function now(){return Date.now()+((S&&S.skew)||0)}

  if(k=="war"&&S.exp.filter(function(x){return x.k=="war"}).length>=3){toast("Hai già 3 eserciti in marcia");return}
  if(S.exp.some(function(x){return x.to==to&&x.k==k})){toast("Una spedizione sta già marciando verso "+S.forts[to].name);return}
  var dur=durExp(S.me,to);S.exp.push({k:k,from:S.me,to:to,t0:now(),dur:dur,arr:false});
  say("Giorno "+S.day+": "+(k=="war"?"esercito":"rinforzi")+" partiti per "+S.forts[to].name+", arrivo tra "+fmtD(dur));save();closeOpp();toast((k=="war"?"Esercito":"Rinforzi")+" in marcia verso "+S.forts[to].name+": arrivo tra "+fmtD(dur));renderPanel();full()}

  var arrows=function(from,to){for(i=0;i<9;i++){var u=t*1.35-i*.07;if(u<=0||u>=1)continue;var px0=from[0]+(to[0]-from[0])*u+(-uy)*(i-4)*sk*1.3,py0=from[1]+(to[1]-from[1])*u+ux*(i-4)*sk*1.3;o+='<line x1="'+px0.toFixed(2)+'" y1="'+py0.toFixed(2)+'" x2="'+(px0+ux*(to===g.fb?1:-1)*sk*3).toFixed(2)+'" y2="'+(py0+uy*(to===g.fb?1:-1)*sk*3).toFixed(2)+'" stroke="var(--ink)" stroke-width="'+(sk*.45).toFixed(2)+'" stroke-linecap="round"/>'}};
  if(F.t==2)arrows(g.fa,g.fb);if(F.e==2)arrows(g.fb,g.fa);
  if(t>.3&&t<.85&&!(F.t==2&&F.e==2)){var rr=(t-.3)*sk*16;for(i=0;i<9;i++){var an=i*Math.PI*2/9;o+='<line x1="'+(mx+Math.cos(an)*rr*.4).toFixed(2)+'" y1="'+(my+Math.sin(an)*rr*.4).toFixed(2)+'" x2="'+(mx+Math.cos(an)*rr).toFixed(2)+'" y2="'+(my+Math.sin(an)*rr).toFixed(2)+'" stroke="#f5c542" stroke-width="'+(sk*.5).toFixed(2)+'" stroke-linecap="round"/>'}}
  if(t>.6)o+='<text x="'+mx.toFixed(2)+'" y="'+(my-sk*6).toFixed(2)+'" font-size="'+(sk*5).toFixed(2)+'" text-anchor="middle" font-weight="700" fill="'+(F.win?"#2f8a46":"#c0392b")+'" stroke="var(--bg)" stroke-width="'+(sk*.4).toFixed(2)+'" paint-order="stroke">'+(F.win?"Round vinto":"Round perso")+'</text>';
  if(fe)fe.innerHTML=o;
  if(t>=1){endFx();return}
  requestAnimationFrame(fxLoop)}
$("enc").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.t!=null)pickT(+b.dataset.t);if(b.id=="encok")finishWar()});
function finishWar(){var me=S.forts[W.from],en=S.forts[W.to],win=E.w>E.l;W.win=win;if(W.n0){var rt=Math.min(1,W.cnt[W.from]/W.n0);S.res=RES().map(function(x){return Math.round(x*rt)})}
  if(win){en.neu=0;en.occ={by:W.from};en.walls=Math.max(1,en.walls-3);me.wins++;en.losses++;TV++}
  else{me.walls=Math.max(1,me.walls-2);me.reinf=0;me.losses++;en.wins++}
  W.ph=2;W.t2=performance.now();E=null;$("enc").classList.remove("open");full();requestAnimationFrame(warLoop)}
function endWar(){var en=S.forts[W.to];
  if(W.win){en.occ=null;en.owner=W.from;FL=W.to;TV++;say("Giorno "+S.day+": hai conquistato "+en.name+". Tributo di 2 soldi al giorno, i suoi abitanti ora combattono per te");setTimeout(function(){FL=-1;TV++;if(!W)full()},2200)}
  else say("Giorno "+S.day+": sconfitta contro "+en.name+", perdi 2 pezzi di mura");
  W=null;save();renderPanel();full()}
/* ---------- musica ---------- */
var AC,MG,musOn=true,nextT=0,stp=0,tmr=0,SEC={};
try{musOn=localStorage.getItem("fz-mus")!="0"}catch(e){}
var MODES=[[0,2,3,5,7,9,10],[0,2,3,5,7,8,10],[0,2,4,5,7,9,10],[0,1,3,5,7,8,10]],ROOTS=[50,57,55,52];
function mfreq(m){return 440*Math.pow(2,(m-69)/12)}
function nt(m,t,d,g,ty){var o=AC.createOscillator(),e=AC.createGain();o.type=ty;o.frequency.value=mfreq(m);e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+.012);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(MG);o.start(t);o.stop(t+d+.05)}
function drum(t,g){var n=Math.floor(AC.sampleRate*.08),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0),s=AC.createBufferSource(),e=AC.createGain(),f=AC.createBiquadFilter();for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);f.type="highpass";f.frequency.value=3000;s.buffer=buf;e.gain.value=g;s.connect(f);f.connect(e);e.connect(MG);s.start(t)}
function phr(seed){var r=rng(seed),d=[0,2,4][Math.floor(r()*3)]+7,out=[],i=0,cells=[1,1,2,1,2,4];
  while(i<32){var l=Math.min(cells[Math.floor(r()*6)],32-i);d+=[-2,-1,-1,0,1,1,2][Math.floor(r()*7)];if(i%8==0&&r()<.5)d=[0,2,4,7,9][Math.floor(r()*5)]+(r()<.5?0:7);d=Math.max(0,Math.min(14,d));out.push([i,d,l]);i+=l}
  out[out.length-1][1]=7;return out}
function msched(s,t){var p8=s%8,pp=s%32,pi=Math.floor(s/32)%4,sd=60/116/2;
  if(s%128==0||!SEC.A){var k=Math.floor(Math.random()*4);SEC={mo:MODES[k],root:ROOTS[k],A:phr(Math.random()*1e6|0),B:phr(Math.random()*1e6|0)}}
  (pi==2?SEC.B:SEC.A).forEach(function(n){if(n[0]==pp){var d=n[1],m=SEC.root+SEC.mo[d%7]+12*Math.floor(d/7);nt(m,t,n[2]*sd*1.05,.2,"triangle");nt(m+12,t,n[2]*sd*.6,.04,"sine")}});
  if(p8==0)nt(SEC.root-12,t,sd*3,.22,"triangle");if(p8==4)nt(SEC.root-5,t,sd*3,.16,"triangle");
  if(pp%8==2||pp%8==6)drum(t,.06);if(pp%8==0)drum(t,.03)}
function pump(){while(nextT<AC.currentTime+.4){msched(stp,nextT);nextT+=60/116/2;stp++}}
function musicStart(){if(!musOn)return;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;var dl=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.23;fb.gain.value=.3;wet.gain.value=.3;MG.connect(AC.destination);MG.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination)}
  AC.resume();if(!tmr){nextT=AC.currentTime+.1;tmr=setInterval(pump,90)}}catch(e){}}
function musicInit(){var b=$("mus");function lab(){b.textContent=musOn?"\u266a Musica: s\u00ec":"\u266a Musica: no"}lab();
  ["touchend","mousedown","keydown"].forEach(function(ev){document.addEventListener(ev,musicStart)});
  b.onclick=function(){musOn=!musOn;try{localStorage.setItem("fz-mus",musOn?"1":"0")}catch(e){}lab();if(musOn)musicStart();else{clearInterval(tmr);tmr=0;if(AC)AC.suspend()}}}

/* ---------- creazione dello stato (una sola volta) ---------- */
function renderFD(){var s=D.s[ds];
  $("fd").innerHTML='<b>Bandiera</b> <span class="empty">(si crea solo adesso, poi non si cambia)</span><div class="fl">'+fsvg(D,150,100,"fprev")+'<div class="fcol"><select id="fp" aria-label="Disegno">'+PATS.map(function(o){return'<option value="'+o[0]+'"'+(D.p==o[0]?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select><span class="cs"><input type="color" id="fc0" value="'+D.c[0]+'" aria-label="Colore 1"><input type="color" id="fc1" value="'+D.c[1]+'" aria-label="Colore 2"><input type="color" id="fc2" value="'+D.c[2]+'" aria-label="Colore 3"></span></div></div>'+
  '<div class="row"><select id="fk" aria-label="Simbolo">'+SYM.map(function(o){return'<option value="'+o[0]+'"'+(s&&s.k==o[0]?' selected':'')+'>'+o[1]+'</option>'}).join("")+'</select><button type="button" class="alt" id="fadd"'+(D.s.length>=4?' disabled':'')+'>Aggiungi simbolo</button></div>'+
  '<div class="row">'+D.s.map(function(q,i){return'<button type="button" class="alt chip'+(i==ds?' on':'')+'" data-s="'+i+'">'+symName(q.k)+'</button>'}).join("")+'</div>'+
  (s?'<div class="sed"><label>Colore<input type="color" id="fsc" value="'+s.c+'"></label><label>Dimensione<input type="range" id="fss" min="2" max="14" value="'+s.z+'"></label><label>Orizzontale<input type="range" id="fsx" min="0" max="100" value="'+s.x+'"></label><label>Verticale<input type="range" id="fsy" min="0" max="100" value="'+s.y+'"></label><button type="button" class="alt" id="fdel">Rimuovi simbolo</button></div>':'')}
function prevF(){$("fprev").innerHTML=flagEl(D,0,0,150,100)}
$("fd").addEventListener("input",function(e){var i=e.target.id,s=D.s[ds],v=e.target.value;
  if(i=="fp")D.p=v;else if(i=="fc0")D.c[0]=v;else if(i=="fc1")D.c[1]=v;else if(i=="fc2")D.c[2]=v;
  else if(s&&i=="fsc")s.c=v;else if(s&&i=="fss")s.z=+v;else if(s&&i=="fsx")s.x=+v;else if(s&&i=="fsy")s.y=+v;else return;prevF()});
$("fd").addEventListener("change",function(e){if(e.target.id=="fk"){if(D.s[ds]){D.s[ds].k=e.target.value;renderFD()}}});
$("fd").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.id=="fadd"&&D.s.length<4){D.s.push({k:$("fk").value,c:"#f5e6b8",x:50,y:50,z:4});ds=D.s.length-1;renderFD()}
  else if(b.id=="fdel"){D.s.splice(ds,1);ds=D.s.length?0:-1;renderFD()}
  else if(b.dataset.s!=null){ds=+b.dataset.s;renderFD()}});
$("f").addEventListener("submit",function(e){e.preventDefault();if(S.me!=null)return;
  var n=$("com").value.trim(),p=$("prov").value.trim().toLowerCase(),r=$("reg").value.trim();if(!n)return;
  var ex=S.forts.findIndex(function(f){return f.name.toLowerCase()==n.toLowerCase()}),fl=JSON.parse(JSON.stringify(D));
  var isNew=ex<0;if(ex<0){var pi=-1;CAPS().forEach(function(c,i){if(pi<0&&p&&c.n.toLowerCase()==p)pi=i});var nf=mk(n,r||(pi>=0?CAPS()[pi].r:""),1);if(pi>=0)nf.prov=pi;S.forts.push(nf);ex=S.forts.length-1}
  var f=S.forts[ex];f.flag=fl;f.neu=0;if(!isNew)f.pop+=1;S.me=ex;var igv=$("ig").value.trim().replace(/\s+/g,"");S.ig=igv?(igv.charAt(0)=="@"?igv:"@"+igv):"";S.mh=f.pop-1;var sg=IG.signori[f.name];
  if(sg&&sg.n!=S.ig)f.lord={n:sg.n,h:0,d:sg.giorno||0,me:false};else f.lord={n:S.ig,h:S.mh,d:S.day,me:true};S.sel=ex;FOC=ex;TV++;S.t0=Date.now();
  D=rflag(Math.random()*1e6|0);ds=-1;$("f").reset();renderFD();save();closeP();renderPanel();full();goHome(1800)});

/* ---------- avvio ---------- */
var CDB=[]; /* elenco comuni da riempire: {n:"Poviglio",p:"Reggio Emilia",r:"Emilia-Romagna",lon:10.53,lat:44.88} */
function nrm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function srch(q){q=nrm(q);if(!q)return[];var out=[];
  S.forts.forEach(function(f,i){var k=nrm(f.name).indexOf(q);if(k>=0)out.push({s:k==0?0:1,t:f.name,sub:(f.cap?"Provincia di "+f.name:"Comune")+" · "+(f.region||"Italia")+(f.neu?" · terra libera":f.owner!=null?" · conquistato":""),i:i})});
  CDB.forEach(function(c){var k=nrm(c.n).indexOf(q);if(k>=0&&!S.forts.some(function(f){return nrm(f.name)==nrm(c.n)}))out.push({s:k==0?0:1,t:c.n,sub:"Comune · provincia di "+c.p+" · "+c.r,c:c})});
  out.sort(function(a,b){return a.s-b.s||a.t.length-b.t.length});return out.slice(0,7)}
function srRender(){var r=srch($("sq").value),b=$("sr");b._r=r;b.innerHTML=r.map(function(x,k){return'<button data-k="'+k+'">'+esc(x.t)+'<br><small>'+esc(x.sub)+'</small></button>'}).join("")}
function srGo(x){if(W)return;closeP();var q;
  if(x.i!=null){var f=S.forts[x.i];q=pos(f);S.sel=x.i;FOC=x.i;if(S.me!=null&&x.i!=S.me)openOpp(x.i);else closeOpp();fly(q[0],q[1],Math.max(map.sc,x.i==S.me?100:14),800)}
  else{q=px(x.c.lon,x.c.lat);closeOpp();fly(q[0],q[1],Math.max(map.sc,20),800);toast(x.c.n+": comune in provincia di "+x.c.p)}
  $("sq").value="";$("sr").innerHTML="";$("sr")._r=[];$("sq").blur()}
$("sq").addEventListener("input",srRender);
$("sq").addEventListener("keydown",function(e){if(e.key=="Enter"){var r=$("sr")._r;if(r&&r[0])srGo(r[0]);e.preventDefault()}if(e.key=="Escape"){this.value="";$("sr").innerHTML="";$("sr")._r=[]}});
$("sr").addEventListener("mousedown",function(e){e.preventDefault()});
$("sr").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var r=$("sr")._r;if(r&&r[+b.dataset.k])srGo(r[+b.dataset.k])});
var rstT=0;$("rst").onclick=function(){var b=$("rst");if(rstT){clearTimeout(rstT);rstT=0;b.textContent="\u21ba Ricomincia";try{localStorage.removeItem(KEY)}catch(e){}S=fresh();map={sc:1,cx:190,cy:215};TV++;FOC=0;D=rflag(Math.random()*1e6|0);ds=-1;closeOpp();renderFD();save();renderPanel();full();openP()}else{b.textContent="Sicuro? Tocca ancora";rstT=setTimeout(function(){rstT=0;b.textContent="\u21ba Ricomincia"},4000)}};
S=load()||fresh();D=rflag(Date.now()%1e6);FOC=S.me!=null?S.me:0;S.forts.forEach(function(f){f.occ=null});realDays();tickExp();
setInterval(function(){tickExp();if(S.me!=null)renderExps()},20000);
setInterval(function(){var d=S.day;realDays();if(S.day!=d){renderPanel();full()}},60000);
$("capl").innerHTML=CAPS().map(function(c){return'<option value="'+esc(c.n)+'">'}).join("");
renderFD();renderPanel();full();if(S.me!=null){closeP();setTimeout(function(){goHome(2600)},500)}musicInit();
})();
